name: Scrape ActiveNet

on:
  schedule:
    # 03:00 Pacific (10:00 UTC during PDT, 11:00 during PST).
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scrape
        run: pnpm scrape --no-cache
      - name: Commit snapshot if the data changed
        run: |
          if node scripts/scrape/changed.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Update ActiveNet snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Snapshot unchanged apart from generatedAt; nothing to commit"
          fi
